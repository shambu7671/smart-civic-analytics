{% extends "base.html" %}{% block title %}Issue Management{% endblock %}{% block content %}<div id="admin-issue-detail" data-issue-id="{{ issue_id }}"></div><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3" id="issue-code">Issue</h1><a href="/admin/issues">Back to issues</a></div><div><button id="verify-issue" class="btn btn-success me-2">Verify</button><button id="map-link" class="btn btn-outline-primary">Open Map</button></div></div><div class="row g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm mb-4"><div class="card-body"><div id="issue-summary"></div><div class="mt-3" id="primary-image-wrap"></div></div></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Supporting Reports</h2><div id="supporting-reports"></div></div></div><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Status History</h2><div id="status-history" class="timeline"></div></div></div></div><div class="col-lg-4"><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Issue Location</h2><div id="admin-issue-map" class="map-box-sm"></div></div></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Priority Controls</h2><label class="form-label">Severity</label><select id="severity" class="form-select mb-2"><option value="1">1 - Very Low</option><option value="2">2 - Low</option><option value="3">3 - Medium</option><option value="4">4 - High</option><option value="5">5 - Critical</option></select><label class="form-label">Location Importance</label><select id="location-importance" class="form-select mb-2"><option value="1">1 - Normal</option><option value="2">2 - Important Road</option><option value="3">3 - School/College</option><option value="4">4 - Hospital/Emergency</option><option value="5">5 - Major Intersection</option></select><button id="save-properties" class="btn btn-primary w-100">Save Priority Inputs</button></div></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Status</h2><select id="status" class="form-select mb-2"><option>REPORTED</option><option>UNDER_REVIEW</option><option>VERIFIED</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>REJECTED</option></select><textarea id="remarks" class="form-control mb-2" rows="2" placeholder="Remarks"></textarea><button id="change-status" class="btn btn-outline-primary w-100">Change Status</button></div></div><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Assignment</h2><input id="assigned-to" class="form-control mb-2" placeholder="Responsible person"><input id="department" class="form-control mb-2" placeholder="Department"><textarea id="assign-remarks" class="form-control mb-2" rows="2" placeholder="Assignment remarks"></textarea><button id="assign-issue" class="btn btn-outline-primary w-100">Assign Issue</button></div></div></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/admin-issue-detail.js') }}"></script>{% endblock %}
