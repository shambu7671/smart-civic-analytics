{% extends "base.html" %}{% block title %}All Civic Issues{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3">Unified Civic Issues</h1><p class="text-muted">One issue may represent several supporting citizen reports.</p></div><div class="d-flex flex-wrap gap-2"><input id="issue-search" class="form-control" style="width:220px" placeholder="Issue code/status"><input id="issue-report-id" class="form-control" style="width:120px" placeholder="Report ID"><select id="issue-category-filter" class="form-select" style="width:150px"><option value="">All categories</option><option value="pothole">Pothole</option><option value="road-damage">Road Damage</option><option value="road-crack">Road Crack</option></select><select id="issue-priority-filter" class="form-select" style="width:130px"><option value="">All priority</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select id="issue-status-filter" class="form-select" style="width:160px"><option value="">All status</option><option>REPORTED</option><option>UNDER_REVIEW</option><option>VERIFIED</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>REJECTED</option></select><button id="issue-search-btn" class="btn btn-primary">Search</button></div></div><div class="card border-0 shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table" id="admin-issues"><thead><tr><th>Issue</th><th>Category</th><th>Reports</th><th>Priority</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody></tbody></table></div><div id="admin-issues-pagination" class="mt-2"></div></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/admin-issues.js') }}"></script>{% endblock %}
